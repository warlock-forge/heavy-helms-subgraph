        - event: ParticipantsSelected(indexed uint256,uint256,uint32[])
          handler: handleParticipantsSelected
        - event: TournamentStarted(indexed uint256,uint8,(uint32,(uint32,(uint32,uint16),uint8))[])
          handler: handleTournamentStarted
        - event: TournamentCompleted(indexed uint256,uint8,indexed uint32,uint32,uint256,uint32[],uint32[])
          handler: handleTournamentCompleted
        # Combat and Ratings
        - event: CombatResult(indexed bytes32,indexed bytes32,indexed uint32,bytes)
          handler: handleCombatResult
        - event: TournamentRatingsAwarded(indexed uint256,indexed uint256,uint32[],uint16[])
          handler: handleTournamentRatingsAwarded
        # Player Management
        - event: PlayerRetiredInTournament(indexed uint256,indexed uint32)
          handler: handlePlayerRetiredInTournament
        - event: PlayerReplaced(indexed uint256,indexed uint32,indexed uint32,uint8)
          handler: handlePlayerReplaced
        # Rewards
        - event: RewardDistributed(indexed uint256,indexed uint32,uint8,uint256)
          handler: handleRewardDistributed
        # Admin Events
        - event: TournamentAutoRecovered(uint256,uint256,uint8)
          handler: handleTournamentAutoRecovered
        - event: TournamentSizeSet(uint8,uint8)
          handler: handleTournamentSizeSet
        - event: LethalityFactorSet(uint16,uint16)
          handler: handleLethalityFactorSet
        - event: RewardConfigUpdated(indexed uint8,(uint16,uint16,uint16,uint16,uint16,uint16,uint16,uint16,uint16))
          handler: handleRewardConfigUpdated
        - event: GameEnabledChanged(bool,bool)
          handler: handleGameEnabledChanged
      file: ./src/tournament-game.ts

