specVersion: 1.2.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum
    name: Player
    network: base-sepolia
    source:
      address: "0xb19f2D8e0f3Fd0111CA49dc5ae2f656972B6Df4c"
      abi: Player
      startBlock: 32265856
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AttributeSwapAwarded
        - CreatePlayerFeeUpdated
        - EquipmentRequirementsUpdated
        - GameContractPermissionsUpdated
        - NameChangeAwarded
        - PausedStateChanged
        - PlayerAttributesSwapped
        - PlayerCreationRequested
        - PlayerImmortalityChanged
        - PlayerKillUpdated
        - PlayerNameUpdated
        - PlayerRetired
        - PlayerSkinEquipped
        - PlayerSlotsPurchased
        - PlayerWinLossUpdated
        - SlotBatchCostUpdated
        - RequestRecovered
        # Add our custom entities
        - Player
        - Owner
        - Skin
      abis:
        - name: Player
          file: ./abis/Player.json
        - name: PlayerSkinNFT
          file: ./abis/PlayerSkinNFT.json
      eventHandlers:
        - event: CreatePlayerFeeUpdated(uint256,uint256)
          handler: handleCreatePlayerFeeUpdated
        - event: EquipmentRequirementsUpdated(indexed address,indexed address)
          handler: handleEquipmentRequirementsUpdated
        - event: GameContractPermissionsUpdated(indexed address,(bool,bool,bool,bool))
          handler: handleGameContractPermissionsUpdated
        - event: PausedStateChanged(bool)
          handler: handlePausedStateChanged
        - event: PlayerAttributesSwapped(indexed uint32,uint8,uint8,uint8,uint8)
          handler: handlePlayerAttributesSwapped
        - event: PlayerCreationRequested(indexed uint256,indexed address,bool)
          handler: handlePlayerCreationRequested
        - event: PlayerImmortalityChanged(indexed uint32,indexed address,bool)
          handler: handlePlayerImmortalityChanged
        - event: PlayerNameUpdated(indexed uint32,uint16,uint16)
          handler: handlePlayerNameUpdated
        - event: PlayerRetired(indexed uint32,indexed address,bool)
          handler: handlePlayerRetired
        - event: PlayerSkinEquipped(indexed uint32,indexed uint32,uint16,uint8)
          handler: handlePlayerSkinEquipped
        - event: PlayerSlotsPurchased(indexed address,uint8,bool)
          handler: handlePlayerSlotsPurchased
        - event: SlotBatchCostUpdated(uint256,uint256)
          handler: handleSlotBatchCostUpdated
        - event: PlayerCreationComplete(indexed uint256,indexed uint32,indexed address,uint256,uint16,uint16,uint8,uint8,uint8,uint8,uint8,uint8,bool)
          handler: handlePlayerCreationComplete
        - event: StanceUpdated(indexed uint32,uint8)
          handler: handleStanceUpdated
        - event: VrfRequestTimeoutUpdated(uint256,uint256)
          handler: handleVrfRequestTimeoutUpdated
        - event: RequestRecovered(indexed uint256,indexed address,uint256,bool,uint256)
          handler: handleRequestRecovered
        # v1.0.0 Player Progression Events
        - event: ExperienceGained(indexed uint32,uint16,uint16)
          handler: handleExperienceGained
        - event: PlayerLevelUp(indexed uint32,uint8)
          handler: handlePlayerLevelUp
        - event: AttributePointAwarded(indexed uint32)
          handler: handleAttributePointAwarded
        - event: PlayerAttributePointUsed(indexed uint32,uint8,uint8,uint256)
          handler: handlePlayerAttributePointUsed
        - event: PlayerWeaponSpecializationChanged(indexed uint32,uint8)
          handler: handlePlayerWeaponSpecializationChanged
        - event: PlayerArmorSpecializationChanged(indexed uint32,uint8)
          handler: handlePlayerArmorSpecializationChanged
        - event: SeasonStarted(indexed uint256,uint256,uint256)
          handler: handleSeasonStarted
        - event: SeasonLengthUpdated(uint256,uint256)
          handler: handleSeasonLengthUpdated
        - event: VRFConfigUpdated(bytes32,uint32,uint16)
          handler: handleVRFConfigUpdated
        - event: SubscriptionIdUpdated(uint256,uint256)
          handler: handleSubscriptionIdUpdated
        # Atomic events for seasonal tracking
        - event: PlayerWinRecorded(indexed uint32,indexed uint256)
          handler: handlePlayerWinRecorded
        - event: PlayerLossRecorded(indexed uint32,indexed uint256)
          handler: handlePlayerLossRecorded
        - event: PlayerKillRecorded(indexed uint32,indexed uint256)
          handler: handlePlayerKillRecorded
      file: ./src/player.ts

  - kind: ethereum
