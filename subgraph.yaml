  # Add GauntletGame data sources (3 brackets for v1.0.0)
  # Levels 1-4 Gauntlet
  - kind: ethereum
    name: GauntletGameLow
    network: base-sepolia
    source:
      address: "0xe76A989546397270EaeAF69412F3D703D975BFaE" # Levels 1-4
      abi: GauntletGame
      startBlock: 32265856
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        # Core Entities
        - Gauntlet
        - GauntletParticipant
        - Player # Updated by this source
        - Owner # Potentially updated if fees paid to owner etc.
        - Fighter # Interface used
        - Skin # Referenced in GauntletParticipant
        - SkinCollection # Needed for Skin lookup
        - Stats # Updated by this source
        # Event Entities
        - PlayerQueued
        - PlayerWithdrew
        - GauntletStarted
        - GauntletCompleted
        - GauntletRecovered
        - CombatResult # Standard combat result, not gauntlet-specific
        - QueuePartiallyCleared
        - DefaultPlayerContractSet
        - GameEngineUpdated
      abis:
        - name: GauntletGame
          file: ./abis/GauntletGame.json
        - name: Player
          file: ./abis/Player.json
        - name: PlayerSkinRegistry
          file: ./abis/PlayerSkinRegistry.json
        - name: PlayerSkinNFT
          file: ./abis/PlayerSkinNFT.json
        - name: DefaultPlayer
          file: ./abis/DefaultPlayer.json
      eventHandlers:
        # Queue Management
        - event: PlayerQueued(indexed uint32,uint256)
          handler: handlePlayerQueuedLow
        - event: PlayerWithdrew(indexed uint32,uint256)
          handler: handlePlayerWithdrewLow
        # Gauntlet Lifecycle
        - event: QueueCommitted(uint256,uint256)
          handler: handleQueueCommittedLow
        - event: ParticipantsSelected(indexed uint256,uint256,uint32[])
          handler: handleParticipantsSelectedLow
        - event: GauntletStarted(indexed uint256,uint8,uint8,(uint32,(uint32,(uint32,uint16),uint8))[])
          handler: handleGauntletStartedLow
        - event: GauntletCompleted(indexed uint256,uint8,uint8,indexed uint32,uint256,uint32[],uint32[])
          handler: handleGauntletCompletedLow
        - event: GauntletRecovered(indexed uint256,uint256,uint32[])
          handler: handleGauntletRecoveredLow
        - event: QueueRecovered(uint256)
          handler: handleQueueRecoveredLow
        - event: PlayerReplaced(indexed uint256,indexed uint32,indexed uint32,uint8)
          handler: handlePlayerReplacedLow
        # BaseGame Event (emitted by GauntletGame during fulfillment)
        - event: CombatResult(indexed bytes32,indexed bytes32,indexed uint32,bytes)
          handler: handleGauntletCombatResultLow
        # Admin & Settings Events
        - event: GauntletSizeSet(uint8,uint8)
          handler: handleGauntletSizeSetLow
        - event: GameEnabledUpdated(bool)
          handler: handleGameEnabledUpdatedLow
        - event: GameEngineUpdated(indexed address,indexed address)
          handler: handleGameEngineUpdatedLow
        - event: QueuePartiallyCleared(uint256,uint256)
          handler: handleQueuePartiallyClearedLow
        - event: MinTimeBetweenGauntletsSet(uint256)
          handler: handleMinTimeBetweenGauntletsSetLow
        - event: DefaultPlayerContractSet(indexed address)
          handler: handleDefaultPlayerContractSetLow
        - event: FutureBlocksForSelectionSet(uint256)
          handler: handleFutureBlocksForSelectionSetLow
        - event: FutureBlocksForTournamentSet(uint256)
          handler: handleFutureBlocksForTournamentSetLow
        - event: EmergencyQueueCleared(uint256,uint256)
          handler: handleEmergencyQueueClearedLow
        # v1.0.0 New Events - Low Bracket (XP only, no rewards)
        - event: GauntletXPAwarded(indexed uint256,uint8,uint32[],uint16[])
          handler: handleGauntletXPAwardedLow
        - event: DailyLimitReset(indexed uint32,uint256,bool)
          handler: handleDailyLimitResetLow
        - event: DailyResetCostUpdated(uint256,uint256)
          handler: handleDailyResetCostUpdatedLow
        - event: DailyGauntletLimitUpdated(uint8,uint8)
          handler: handleDailyGauntletLimitUpdatedLow
      file: ./src/gauntlet-game.ts

