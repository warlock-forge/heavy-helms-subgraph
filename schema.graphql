# ==========================================================
#                   FIGHTER SNAPSHOTS                       
# ==========================================================
# Complete historical snapshot entity containing all fighter data at combat time
# Created for each fighter in each combat for battle archives and historical analysis
type FighterSnapshot @entity(immutable: true) {
  id: ID!                    # "combatResultId-1" or "combatResultId-2" (player1/player2)
  
  # Fighter identification (bytes [0-3])
  playerId: BigInt!          # The actual player/defaultPlayer/monster ID
  fighterType: String!       # "Player", "DefaultPlayer", or "Monster"
  
  # Attributes (bytes [4-9])
  strength: Int!             # byte 4
  constitution: Int!         # byte 5
  size: Int!                 # byte 6
  agility: Int!              # byte 7
  stamina: Int!              # byte 8
  luck: Int!                 # byte 9
  
  # Skin info (bytes [10-15])
  skinIndex: BigInt!         # bytes [10-13] - skin collection ID
  skinTokenId: Int!          # bytes [14-15] - token ID within collection
  currentSkin: Skin!         # Resolved skin entity (required, fallback to default)
  
  # Stance (byte [16])
  stance: Int!               # byte 16 - 0=Defensive, 1=Balanced, 2=Offensive
  
  # Names (bytes [17-20])
  firstNameIndex: Int!       # bytes [17-18]
  surnameIndex: Int!         # bytes [19-20] 
  fullName: String!          # Computed from name indices for display
  
  # Combat Record AT THAT TIME (bytes [21-26])
  wins: Int!                 # bytes [21-22] - wins at time of combat
  losses: Int!               # bytes [23-24] - losses at time of combat
  kills: Int!                # bytes [25-26] - kills at time of combat
  
  # Progression AT THAT TIME (bytes [27-31])
  level: Int!                # byte 27 - character level (1-10)
  currentXP: Int!            # bytes [28-29] - experience points
  weaponSpecialization: Int! # byte 30 - weapon class specialization (255 = none)
  armorSpecialization: Int!  # byte 31 - armor specialization (255 = none)
  
  # Snapshot metadata
  createdAt: BigInt!         # Block timestamp when snapshot was created
}

# ==========================================================
#                   FIGHTER PARTICIPANTS                     
# ==========================================================
# Represents a locked loadout commitment (skin + stance)
# Reusable across duels, gauntlets, tournaments
type FighterParticipant @entity(immutable: false) {
  id: ID!                    # Counter-based unique ID
  
  # Core fighter reference
  playerId: BigInt!          # The fighter who committed this loadout
  fighterType: String!       # "Player", "DefaultPlayer", or "Monster"
  
  # Locked loadout data
  skinIndex: BigInt!         # Committed skin collection ID
  skinTokenId: Int!          # Committed skin token ID within collection
  stance: Int!               # Committed stance (0=Defensive, 1=Balanced, 2=Offensive)
  
  # Metadata
  createdAt: BigInt!         # When this loadout commitment was made
}

# ==========================================================
#                   DUEL GAME ENTITIES                       
# ==========================================================
type DuelChallenge @entity(immutable: false) {
  id: ID!
  challengerId: BigInt!
  defenderId: BigInt!
  
  # Keep owner references on the challenge for direct querying
  challengerOwner: Owner
  defenderOwner: Owner
  
  # Fighter snapshots for rich UI data (created at challenge time)
  challengerSnapshot: FighterSnapshot!          # Challenger's state when challenge created
  defenderSnapshot: FighterSnapshot!            # Defender's state when challenge created (even though may change before acceptance)
  
  createdBlock: BigInt!
  createdAt: BigInt!
  expiresTimestamp: BigInt

  state: DuelChallengeState!
  
  # Payment method tracking
  paidWithTicket: Boolean!                      # true if paid with ticket, false if paid with ETH
  
  # Fields for completed duels
  winnerId: BigInt
  randomness: BigInt
}

# Define an enum for duel states
enum DuelChallengeState {
  OPEN
  PENDING
  COMPLETED
  CANCELLED
  FORFEITED
}

