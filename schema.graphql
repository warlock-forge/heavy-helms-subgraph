# ==========================================================
#                   FIGHTER SNAPSHOTS                       
# ==========================================================
# Lean snapshot entity for historical display data
# Deduplicates based on name+skin+stance+level combination
type FighterSnapshot @entity(immutable: true) {
  id: ID!                    # "playerId-fullName-skinId-stance-level"
  
  # Fighter identification
  playerId: BigInt!          # The actual player/defaultPlayer/monster ID
  fighterType: String!       # "Player", "DefaultPlayer", or "Monster"
  
  # Display data
  fullName: String!          # Computed name for UI display
  currentSkin: Skin          # Link to skin entity
  stance: Int!               # Stance at snapshot time
  level: Int!                # Progression level at snapshot time
  
  # Snapshot metadata
  createdAt: BigInt!         # When this combination was first seen
}

# ==========================================================
#                   DUEL GAME ENTITIES                       
# ==========================================================
type DuelChallenge @entity {
  id: ID!
  challengerId: BigInt!
  defenderId: BigInt!
  
  # Keep owner references on the challenge for direct querying
  challengerOwner: Owner
  defenderOwner: Owner
  
  # Historical fighter snapshots (created when combat occurs)
  challengerSnapshot: FighterSnapshot
  defenderSnapshot: FighterSnapshot
  
  createdBlock: BigInt!
  createdAt: BigInt!
  expiresTimestamp: BigInt

  state: DuelChallengeState!
  
  # Fields for completed duels
  winnerId: BigInt
  randomness: BigInt
}

# Define an enum for duel states
enum DuelChallengeState {
  OPEN
  PENDING
  COMPLETED
  CANCELLED
  FORFEITED
}

