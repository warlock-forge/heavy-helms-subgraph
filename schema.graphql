# ==========================================================
#                   DAILY GAUNTLET TRACKING                  
# ==========================================================
# Efficiently tracks daily gauntlet participation per player per bracket
# Uses STATIC ID approach - same entity gets updated daily (zero garbage!)
type PlayerDailyGauntletStats @entity(immutable: false) {
  id: ID!                     # "{playerId}-{bracketId}" (STATIC - no dayNumber!)
  player: Player!             # Reference to Player entity
  playerId: BigInt!           # uint32 player ID for fast filtering
  bracket: GauntletBracket!   # Which bracket these stats apply to
  bracketId: String!          # "low", "mid", or "high" for fast filtering
  dayNumber: BigInt!          # Current day number being tracked
  
  # Core daily tracking (what we actually need!)
  entriesUsed: Int!           # Number of gauntlet entries used today
  canQueue: Boolean!          # Cached boolean: entriesUsed < bracket.currentDailyLimit
  
  # Reset tracking for TODAY (gets reset daily but keeps history)
  resetsWithETHToday: Int!    # Number of ETH resets today
  resetsWithTicketToday: Int! # Number of ticket resets today
  totalResetsToday: Int!      # resetsWithETHToday + resetsWithTicketToday
  lastResetTimestamp: BigInt  # When the most recent reset occurred today
  
  # All-time reset tracking (persists across days)
  totalResetsWithETH: Int!    # Total ETH resets ever for this player+bracket
  totalResetsWithTicket: Int! # Total ticket resets ever for this player+bracket  
  totalResets: Int!           # totalResetsWithETH + totalResetsWithTicket
  
  # Timestamps
  lastUpdated: BigInt!        # Last time this entity was updated
}

