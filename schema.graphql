# ==========================================================
#                   INTERFACES                               
# ==========================================================
# Add a Fighter interface that represents common properties
interface Fighter {
  id: ID!                  # Unique identifier
  fighterId: BigInt!       # Numeric ID from contract
  fighterType: String!     # "Player", "DefaultPlayer", or "Monster"
  
  # Common attributes
  strength: Int!
  constitution: Int!
  size: Int!
  agility: Int!
  stamina: Int!
  luck: Int!
  
  # Name fields
  firstNameIndex: Int!
  surnameIndex: Int!
  firstName: String
  surname: String
  fullName: String
  
  # Skin information
  currentSkin: Skin
  
  # Record fields
  wins: Int!
  losses: Int!
  kills: Int!
  gauntletWins: Int!       # Number of gauntlets won
  duelWins: Int!           # Number of duels won
  tournamentWins: Int!     # Number of tournaments won
  
  # Stance field (new)
  stance: Int!            # uint8 stance value
  
  # v1.0.0 Progression fields
  level: Int!             # uint8 level (1-10)
  currentXP: Int!         # uint16 current experience points
  weaponSpecialization: Int! # uint8 weapon class specialization (255 = none)
  armorSpecialization: Int!  # uint8 armor specialization (255 = none)
  
  createdAt: BigInt!
  lastUpdatedAt: BigInt!
}

# ==========================================================
#                   CORE ENTITIES                            
# ==========================================================
# Keep your existing Player entity but implement the Fighter interface
type Player implements Fighter @entity {
  id: ID!
  fighterId: BigInt!
  fighterType: String!    # Will always be "Player"
  owner: Owner!
  isRetired: Boolean!
  isImmortal: Boolean!    # Only players have this
  
  # Common attributes from Fighter
  strength: Int!
  constitution: Int!
  size: Int!
  agility: Int!
  stamina: Int!
  luck: Int!
  
  # Name fields
  firstNameIndex: Int!
  surnameIndex: Int!
  firstName: String
  surname: String
  fullName: String
  
  # Skin information
  currentSkin: Skin
  
  # Record fields
  wins: Int!
  losses: Int!
  kills: Int!
  gauntletWins: Int!       # Number of gauntlets won
  duelWins: Int!           # Number of duels won
  tournamentWins: Int!     # Number of tournaments won
  
  # Stance field (new)
  stance: Int!            # uint8 stance value, defaults to 1
  
  # v1.0.0 Progression fields
  level: Int!             # uint8 level (1-10)
  currentXP: Int!         # uint16 current experience points
  weaponSpecialization: Int! # uint8 weapon class specialization (255 = none)
  armorSpecialization: Int!  # uint8 armor specialization (255 = none)
  attributePoints: BigInt!   # Available attribute points from leveling
  
  createdAt: BigInt!
  lastUpdatedAt: BigInt!
  creationTx: Bytes!
  winPercentage: BigDecimal!    # Win percentage (0-100)
  totalFights: Int!             # Total number of fights (wins + losses)
  gauntletStatus: PlayerGauntletStatus! # Default to NONE
  currentGauntlet: Gauntlet # Link to Gauntlet if IN_GAUNTLET
  tournamentStatus: PlayerTournamentStatus! # Default to NONE
  currentTournament: Tournament # Link to Tournament if IN_TOURNAMENT
}


# DefaultPlayer entities implement Fighter directly - no more separate "Progression" entities
type DefaultPlayer implements Fighter @entity {
  id: ID!                    # "{playerId}-{level}"
  fighterId: BigInt!         # playerId * 100 + level (e.g., 12305 for player 123 level 5)
  fighterType: String!       # "DefaultPlayer"
  level: Int!               # Level (1-10)
  isRetired: Boolean!       # Always false
  
  # Combat attributes that vary by level
  strength: Int!
  constitution: Int!
  size: Int!
  agility: Int!
  stamina: Int!
  luck: Int!
  weaponSpecialization: Int! # uint8 weapon class specialization (255 = none)
  armorSpecialization: Int!  # uint8 armor specialization (255 = none)
  
  # Fighter interface requirements
  firstNameIndex: Int!
  surnameIndex: Int!
  firstName: String
  surname: String
  fullName: String
  currentSkin: Skin
  stance: Int!
  
  # Progression fields
  currentXP: Int!           # Always 0 for DefaultPlayers
  
  # Record fields (always 0 for DefaultPlayers)
  wins: Int!                # Always 0
  losses: Int!              # Always 0
  kills: Int!               # Always 0
  gauntletWins: Int!        # Always 0
  duelWins: Int!            # Always 0
  tournamentWins: Int!      # Always 0
  
  createdAt: BigInt!
  lastUpdatedAt: BigInt!
}

# Monster entities implement Fighter directly - no more separate "Progression" entities
type Monster implements Fighter @entity {
  id: ID!                    # "{monsterId}-{level}"
  fighterId: BigInt!         # monsterId * 100 + level (e.g., 45607 for monster 456 level 7)
  fighterType: String!       # "Monster"
  level: Int!               # Level (1-10)
  isRetired: Boolean!       # Always false
  
  # Combat attributes that vary by level
  strength: Int!
  constitution: Int!
  size: Int!
  agility: Int!
  stamina: Int!
  luck: Int!
  weaponSpecialization: Int! # uint8 weapon class specialization (255 = none)
  armorSpecialization: Int!  # uint8 armor specialization (255 = none)
  
  # Fighter interface requirements
  firstNameIndex: Int!
  surnameIndex: Int!
  firstName: String
  surname: String
  fullName: String
  currentSkin: Skin
  stance: Int!
  
  # Progression fields
  currentXP: Int!           # Always 0 for Monsters
  
  # Record fields (always 0 for Monsters)
  wins: Int!                # Always 0
  losses: Int!              # Always 0
  kills: Int!               # Always 0
  gauntletWins: Int!        # Always 0
  duelWins: Int!            # Always 0
  tournamentWins: Int!      # Always 0
  
  createdAt: BigInt!
  lastUpdatedAt: BigInt!
}

