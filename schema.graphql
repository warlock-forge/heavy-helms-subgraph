# ==========================================================
#                   GAUNTLET GAME ENTITIES                   
# ==========================================================

enum GauntletState {
  PENDING
  COMPLETED
}

enum PlayerGauntletStatus {
  NONE
  QUEUED
  IN_GAUNTLET
}

enum PlayerTournamentStatus {
  NONE
  QUEUED
  IN_TOURNAMENT
}

# Represents a single Gauntlet run
type Gauntlet @entity {
  id: ID!                  # Gauntlet ID (uint256 from contract)
  size: Int!               # 4, 8, 16, or 32
  state: GauntletState!    # PENDING or COMPLETED
  levelBracket: Int!       # 0=LEVELS_1_TO_4, 1=LEVELS_5_TO_9, 2=LEVEL_10
  vrfRequestId: BigInt     # ID of the associated VRF request
  vrfRequestTimestamp: BigInt! # Timestamp of VRF request
  completionTimestamp: BigInt # Timestamp of completion or recovery
  participants: [GauntletParticipant!]! @derivedFrom(field: "gauntlet") # List of participants (INITIAL REGISTRANTS)
  roundWinners: [String!]  # List of Fighter IDs for each round winner (size - 1)
  championSnapshot: FighterSnapshot # Historical snapshot of champion when they won
  startedAt: BigInt!       # Timestamp GauntletStarted event occurred
  startedTx: Bytes!        # Transaction hash of GauntletStarted
  completedAt: BigInt      # Timestamp GauntletCompleted event occurred
  completedTx: Bytes       # Transaction hash of GauntletCompleted
  recoveredAt: BigInt      # Timestamp GauntletRecovered event occurred
  recoveredTx: Bytes       # Transaction hash of GauntletRecovered
  finalParticipantIds: [String!] # List of final participant IDs (INCLUDING SUBSTITUTIONS)
}

# Represents a player's participation in a specific Gauntlet
type GauntletParticipant @entity {
  id: ID!                  # Composite ID: "{gauntletId}-{playerId}"
  gauntlet: Gauntlet!      # Link back to the Gauntlet
  fighterSnapshot: FighterSnapshot! # Historical snapshot of the participant
}

# ==========================================================
#                   TOURNAMENT GAME ENTITIES                  
# ==========================================================
type Tournament @entity {
  id: ID!                  # Tournament ID (uint256 from contract)
  size: Int!               # 16, 32, or 64
  state: TournamentState!  # PENDING or COMPLETED
  startTimestamp: BigInt!  # When tournament started
  completionTimestamp: BigInt # When tournament completed
  participants: [TournamentParticipant!]! @derivedFrom(field: "tournament") # List of participants
  roundWinners: [String!]  # List of Fighter IDs for each round winner (size - 1)
  championSnapshot: FighterSnapshot # Historical snapshot of champion when they won
  runnerUpSnapshot: FighterSnapshot # Historical snapshot of runner-up
  startedAt: BigInt!       # Timestamp TournamentStarted event occurred
  startedTx: Bytes!        # Transaction hash of TournamentStarted
  completedAt: BigInt      # Timestamp TournamentCompleted event occurred
  completedTx: Bytes       # Transaction hash of TournamentCompleted
  finalParticipantIds: [String!] # List of final participant IDs (INCLUDING SUBSTITUTIONS)
}

enum TournamentState {
  PENDING
  COMPLETED
}

# Represents a player's participation in a specific Tournament
type TournamentParticipant @entity {
  id: ID!                  # Composite ID: "{tournamentId}-{playerId}"
  tournament: Tournament!  # Link back to the Tournament
  fighterSnapshot: FighterSnapshot! # Historical snapshot of the participant
}

