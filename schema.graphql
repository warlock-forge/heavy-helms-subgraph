# ==========================================================
#                   SINGLETON ENTITIES                       
# ==========================================================
# Counter for generating sequential snapshot IDs
type SnapshotCounter @entity(immutable: false) {
  id: ID!          # Always "counter"
  nextId: BigInt!  # Next available ID number
}

# ==========================================================
#                   INTERFACES                               
# ==========================================================
# Add a Fighter interface that represents common properties
interface Fighter {
  id: ID!                  # Unique identifier
  fighterId: BigInt!       # Numeric ID from contract
  fighterType: String!     # "Player", "DefaultPlayer", or "Monster"

  # Common attributes
  strength: Int!
  constitution: Int!
  size: Int!
  agility: Int!
  stamina: Int!
  luck: Int!

  # Name fields
  firstNameIndex: Int!
  surnameIndex: Int!
  firstName: String
  surname: String
  fullName: String

  # Skin information
  currentSkin: Skin!

  # Record fields
  wins: Int!
  losses: Int!
  kills: Int!
  duelWins: Int!           # Number of duels won
  tournamentWins: Int!     # Number of tournaments won

  # Stance field (new)
  stance: Int!            # uint8 stance value
  
  # v1.0.0 Progression fields
  level: Int!             # uint8 level (1-10)
  currentXP: Int!         # uint16 current experience points
  weaponSpecialization: Int! # uint8 weapon class specialization (255 = none)
  armorSpecialization: Int!  # uint8 armor specialization (255 = none)
  
  createdAt: BigInt!
  lastUpdatedAt: BigInt!
}

# ==========================================================
#                   PLAYER GAUNTLET STATS
# ==========================================================
type PlayerGauntletStat @entity(immutable: false) {
  id: ID!                    # Unique identifier (playerId for now, but allows future expansion)
  playerId: BigInt!          # Player ID for efficient filtering and sorting
  player: Player!

  # Total across all brackets
  totalGauntletsCompleted: Int!
  totalGauntletWins: Int!

  # Per-bracket completions
  lowBracketCompleted: Int!
  midBracketCompleted: Int!
  highBracketCompleted: Int!

  # Per-bracket wins
  lowBracketWins: Int!
  midBracketWins: Int!
  highBracketWins: Int!

  # Metadata
  firstGauntlet: BigInt      # Timestamp of first gauntlet
  lastGauntlet: BigInt       # Timestamp of most recent gauntlet
  lastUpdated: BigInt!
}

# ==========================================================
#                   CORE ENTITIES
# ==========================================================
# Keep your existing Player entity but implement the Fighter interface
type Player implements Fighter @entity(immutable: false) {
  id: ID!
  fighterId: BigInt!
  fighterType: String!    # Will always be "Player"
  owner: Owner!
  isRetired: Boolean!
  isImmortal: Boolean!    # Only players have this

  # Common attributes from Fighter
  strength: Int!
  constitution: Int!
  size: Int!
  agility: Int!
  stamina: Int!
  luck: Int!

  # Name fields
  firstNameIndex: Int!
  surnameIndex: Int!
  firstName: String
  surname: String
  fullName: String

  # Skin information
  currentSkin: Skin!

  # Record fields
  wins: Int!
  losses: Int!
  kills: Int!
  duelWins: Int!           # Number of duels won
  tournamentWins: Int!     # Number of tournaments won
  
  # Stance field (new)
  stance: Int!            # uint8 stance value, defaults to 1
  
  # v1.0.0 Progression fields
  level: Int!             # uint8 level (1-10)
  currentXP: Int!         # uint16 current experience points
  weaponSpecialization: Int! # uint8 weapon class specialization (255 = none)
  armorSpecialization: Int!  # uint8 armor specialization (255 = none)
  attributePoints: BigInt!   # Available attribute points from leveling
  
  createdAt: BigInt!
  lastUpdatedAt: BigInt!
  creationTx: Bytes!
  winPercentage: BigDecimal!    # Win percentage (0-100)
  totalFights: Int!             # Total number of fights (wins + losses)
  gauntletStatus: PlayerGauntletStatus! # Default to NONE
  currentGauntlet: Gauntlet # Link to Gauntlet if IN_GAUNTLET

  # Gauntlet statistics
  gauntletStats: PlayerGauntletStat @derivedFrom(field: "player") # Link to gauntlet statistics (created on first gauntlet)
  gauntletBracket: GauntletBracket!  # Current bracket based on player level
  currentGauntletDailyStats: PlayerDailyGauntletStats # Link to current gauntlet daily stats

  tournamentStatus: PlayerTournamentStatus! # Default to NONE
  currentTournament: Tournament # Link to Tournament if IN_TOURNAMENT
}


# DefaultPlayer entities implement Fighter directly - no more separate "Progression" entities
type DefaultPlayer implements Fighter @entity(immutable: false) {
  id: ID!                    # "{playerId}-{level}"
  fighterId: BigInt!         # The base player ID (same for all levels)
  fighterType: String!       # "DefaultPlayer"
  level: Int!               # Level (1-10)
  isRetired: Boolean!       # Always false
  
  # Combat attributes that vary by level
  strength: Int!
  constitution: Int!
  size: Int!
  agility: Int!
  stamina: Int!
  luck: Int!
  weaponSpecialization: Int! # uint8 weapon class specialization (255 = none)
  armorSpecialization: Int!  # uint8 armor specialization (255 = none)
  
  # Fighter interface requirements
  firstNameIndex: Int!
  surnameIndex: Int!
  firstName: String
  surname: String
  fullName: String
  currentSkin: Skin!
  stance: Int!
  
  # Progression fields
  currentXP: Int!           # Always 0 for DefaultPlayers
  
  # Record fields (always 0 for DefaultPlayers)
  wins: Int!                # Always 0
  losses: Int!              # Always 0
  kills: Int!               # Always 0
  duelWins: Int!            # Always 0
  tournamentWins: Int!      # Always 0
  
  createdAt: BigInt!
  lastUpdatedAt: BigInt!
}

