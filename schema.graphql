# ==========================================================
#                   SEASONAL TRACKING ENTITIES                       
# ==========================================================

type Season @entity {
  id: ID!                     # Season ID as string
  seasonId: BigInt!           # uint256 season ID from contract
  startTimestamp: BigInt!     # When season started
  startBlock: BigInt!         # Block when season started
  endTimestamp: BigInt        # When season ended (null if current)
  endBlock: BigInt           # Block when season ended (null if current)
  isActive: Boolean!          # Whether this is the current season
  playerStats: [PlayerSeasonalStats!]! @derivedFrom(field: "season")
  createdAt: BigInt!
  lastUpdatedAt: BigInt!
}

type PlayerSeasonalStats @entity {
  id: ID!                     # "{seasonId}-{playerId}"
  season: Season!             # Reference to Season
  seasonId: BigInt!           # uint256 season ID for easy filtering
  playerId: BigInt!           # uint32 player ID for easy filtering
  
  # Seasonal combat records
  wins: Int!                  # Wins this season
  losses: Int!                # Losses this season
  kills: Int!                 # Kills this season
  
  # Tournament-specific seasonal data
  tournamentRating: Int!      # Tournament rating for this season (0 if not rated)
  tournamentsPlayed: Int!     # Number of tournaments participated in this season
  tournamentWins: Int!        # Number of tournaments won this season
  
  # Gauntlet-specific seasonal data
  gauntletsPlayed: Int!       # Number of gauntlets participated in this season
  gauntletWins: Int!          # Number of gauntlets won this season
  
  # Duel-specific seasonal data
  duelsPlayed: Int!           # Number of duels participated in this season
  duelWins: Int!              # Number of duels won this season
  
  createdAt: BigInt!
  lastUpdatedAt: BigInt!
}

